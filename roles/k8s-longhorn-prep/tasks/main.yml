---
# ===== Longhorn prerequisites =====
- name: Install Longhorn prerequisites
  ansible.builtin.apt:
    name: "{{ longhorn_packages }}"
    state: present
    update_cache: true

- name: Enable and start iscsid
  ansible.builtin.service:
    name: iscsid
    state: started
    enabled: true

# ===== NVMe tier (uses existing OS disk free space) =====
- name: Create Longhorn NVMe data directory
  ansible.builtin.file:
    path: /var/lib/longhorn
    state: directory
    mode: '0750'

# ===== SATA tier (separate disk, auto-discovered as first disk with no partitions) =====
- name: Check if SATA mount point is already mounted
  ansible.builtin.command: mountpoint -q /var/lib/longhorn-sata
  register: sata_mounted
  changed_when: false
  failed_when: false

- name: Auto-discover SATA disk (first block disk with no partition children)
  ansible.builtin.shell: |
    lsblk -dno NAME,TYPE | awk '$2=="disk" {print $1}' | while read disk; do
      if ! lsblk -no TYPE /dev/$disk 2>/dev/null | grep -q '^part$'; then
        echo "/dev/$disk"
        break
      fi
    done
  register: discovered_sata_disk
  changed_when: false
  when: sata_mounted.rc != 0

- name: Check SATA disk filesystem type
  ansible.builtin.command: blkid -s TYPE -o value {{ discovered_sata_disk.stdout | trim }}
  register: sata_fstype
  changed_when: false
  failed_when: false
  when: sata_mounted.rc != 0

- name: Format SATA disk as XFS
  ansible.builtin.command: mkfs.xfs -f {{ discovered_sata_disk.stdout | trim }}
  when: sata_mounted.rc != 0 and (sata_fstype.stdout | trim) != 'xfs'
  changed_when: sata_mounted.rc != 0 and (sata_fstype.stdout | trim) != 'xfs'

- name: Create Longhorn SATA mount point
  ansible.builtin.file:
    path: /var/lib/longhorn-sata
    state: directory
    mode: '0750'

- name: Get SATA disk UUID
  ansible.builtin.command: blkid -s UUID -o value {{ discovered_sata_disk.stdout | trim }}
  register: sata_uuid
  changed_when: false
  when: sata_mounted.rc != 0

- name: Mount SATA disk and persist in fstab
  ansible.posix.mount:
    path: /var/lib/longhorn-sata
    src: "UUID={{ sata_uuid.stdout | trim }}"
    fstype: xfs
    opts: defaults
    dump: '0'
    passno: '2'
    state: mounted
  when: sata_mounted.rc != 0
