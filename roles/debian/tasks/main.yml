---
- name: Upgrade all packages
  apt: upgrade=dist force_apt_get=yes

- name: Install our extra packages
  apt: name={{ add_packages }} state=present

- name: Set gateway as base DNS in resolvconf
  ansible.builtin.copy:
    content: "nameserver {{ ansible_default_ipv4.gateway }}\n"
    dest: /etc/resolvconf/resolv.conf.d/base
    owner: root
    group: root
    mode: '0644'

- name: Regenerate resolv.conf
  ansible.builtin.command: resolvconf -u

- name: Install QEMU Guest Agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present

- name: Set timezone to Eastern
  become: true
  community.general.timezone:
    name: America/New_York
  when: inventory_hostname | lower not in ['slama-read-dev02v', 'slama-read-ana01v']

- name: Set system hostname from Proxmox VM name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
    use: systemd

- name: Ensure hostname resolves in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\s*127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present