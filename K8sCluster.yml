---
- name: Prepare all Kubernetes nodes
  hosts: k8s
  become: true
  roles:
    - debian
    - k8s-common

- name: Prepare worker nodes for Longhorn storage
  hosts: k8work
  become: true
  roles:
    - k8s-longhorn-prep

# -----------------------------------------------------------------------------
# Play 3: Initialize the first control plane node
# -----------------------------------------------------------------------------
- name: Initialize first control plane node
  hosts: slama-read-k8ctrl01v
  become: true
  tasks:
    - name: Check if cluster is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Check if cluster API is healthy
      ansible.builtin.shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf cluster-info
      register: cluster_health
      changed_when: false
      failed_when: false
      when: admin_conf.stat.exists

    - name: Set cluster_initialized fact
      ansible.builtin.set_fact:
        cluster_initialized: "{{ admin_conf.stat.exists and (cluster_health.rc | default(1)) == 0 }}"

    - name: Reset partial cluster initialization
      ansible.builtin.shell: kubeadm reset -f
      when: admin_conf.stat.exists and not cluster_initialized

    - name: Remove partial /etc/kubernetes directory
      ansible.builtin.file:
        path: /etc/kubernetes
        state: absent
      when: admin_conf.stat.exists and not cluster_initialized

    - name: Create manifests directory
      ansible.builtin.file:
        path: /etc/kubernetes/manifests
        state: directory
        mode: '0755'

    - name: Pre-pull kube-vip image to avoid pull timeout during VIP wait
      ansible.builtin.command: >
        crictl pull ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
      when: not cluster_initialized
      changed_when: false

    - name: Stop kubelet to prevent premature kube-vip start
      ansible.builtin.service:
        name: kubelet
        state: stopped
      when: not cluster_initialized

    - name: Template kube-vip static pod manifest (bootstrap - no leader election)
      ansible.builtin.template:
        src: roles/k8s-common/templates/kube-vip.yaml.j2
        dest: /etc/kubernetes/manifests/kube-vip.yaml
        mode: '0644'
      vars:
        kube_vip_leaderelection: "false"
        kube_vip_svc_enable: "false"
      when: not cluster_initialized

    - name: Template kube-vip static pod manifest (already initialized)
      ansible.builtin.template:
        src: roles/k8s-common/templates/kube-vip.yaml.j2
        dest: /etc/kubernetes/manifests/kube-vip.yaml
        mode: '0644'
      when: cluster_initialized

    - name: Generate kubeadm config file
      ansible.builtin.copy:
        dest: /etc/kubernetes/kubeadm-config.yaml
        mode: '0600'
        content: |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: ClusterConfiguration
          controlPlaneEndpoint: "{{ k8s_vip }}:6443"
          networking:
            podSubnet: "{{ k8s_pod_cidr }}"
            serviceSubnet: "{{ k8s_service_cidr }}"
      when: not cluster_initialized

    - name: Initialize Kubernetes cluster (core phases)
      ansible.builtin.shell: >
        kubeadm init
        --config /etc/kubernetes/kubeadm-config.yaml
        --skip-phases=upload-config,mark-control-plane,bootstrap-token,kubelet-finalize,addon,show-join-command
      when: not cluster_initialized
      register: kubeadm_init

    - name: Wait for kube-vip to claim VIP via ARP
      ansible.builtin.command: ping -c 1 -W 1 {{ k8s_vip }}
      register: ping_result
      until: ping_result.rc == 0
      retries: 30
      delay: 2
      changed_when: false
      when: not cluster_initialized

    - name: Complete kubeadm init - upload-config
      ansible.builtin.command: kubeadm init phase upload-config all --config /etc/kubernetes/kubeadm-config.yaml
      when: kubeadm_init.changed

    - name: Complete kubeadm init - mark-control-plane
      ansible.builtin.command: kubeadm init phase mark-control-plane --config /etc/kubernetes/kubeadm-config.yaml
      when: kubeadm_init.changed

    - name: Complete kubeadm init - bootstrap-token
      ansible.builtin.command: kubeadm init phase bootstrap-token --config /etc/kubernetes/kubeadm-config.yaml
      when: kubeadm_init.changed

    - name: Complete kubeadm init - kubelet-finalize
      ansible.builtin.command: kubeadm init phase kubelet-finalize all --config /etc/kubernetes/kubeadm-config.yaml
      when: kubeadm_init.changed

    - name: Complete kubeadm init - addon
      ansible.builtin.command: kubeadm init phase addon all --config /etc/kubernetes/kubeadm-config.yaml
      when: kubeadm_init.changed

    - name: Re-template kube-vip manifest with leader election enabled
      ansible.builtin.template:
        src: roles/k8s-common/templates/kube-vip.yaml.j2
        dest: /etc/kubernetes/manifests/kube-vip.yaml
        mode: '0644'
      when: kubeadm_init.changed

    - name: Apply kube-vip RBAC
      ansible.builtin.shell: kubectl apply -f https://kube-vip.io/manifests/rbac.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: not cluster_initialized
      changed_when: true

    - name: Set up kubeconfig for ansible user
      ansible.builtin.file:
        path: /home/ansible/.kube
        state: directory
        owner: ansible
        group: ansible
        mode: '0755'

    - name: Copy admin.conf for ansible user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ansible/.kube/config
        remote_src: true
        owner: ansible
        group: ansible
        mode: '0600'

    - name: Re-upload certs and capture certificate key
      ansible.builtin.shell: |
        set -eo pipefail
        kubeadm init phase upload-certs --upload-certs 2>&1 | grep -E '^[0-9a-f]{64}$'
      args:
        executable: /bin/bash
      register: cert_key_result
      changed_when: false

    - name: Generate control plane join command
      ansible.builtin.shell: >
        kubeadm token create
        --print-join-command
        --certificate-key {{ cert_key_result.stdout | trim }}
      register: control_join_result
      changed_when: false

    - name: Generate worker join command
      ansible.builtin.shell: kubeadm token create --print-join-command
      register: worker_join_result
      changed_when: false

    - name: Store join commands for use in later plays
      ansible.builtin.add_host:
        name: K8S_JOIN_DATA
        control_join_command: "{{ control_join_result.stdout }}"
        worker_join_command: "{{ worker_join_result.stdout }}"

# -----------------------------------------------------------------------------
# Play 4: Join the remaining control plane nodes
# -----------------------------------------------------------------------------
- name: Join additional control plane nodes
  hosts: k8control:!slama-read-k8ctrl01v
  become: true
  tasks:
    - name: Check if node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Create manifests directory
      ansible.builtin.file:
        path: /etc/kubernetes/manifests
        state: directory
        mode: '0755'

    - name: Template kube-vip static pod manifest
      ansible.builtin.template:
        src: roles/k8s-common/templates/kube-vip.yaml.j2
        dest: /etc/kubernetes/manifests/kube-vip.yaml
        mode: '0644'

    - name: Join as control plane node
      ansible.builtin.shell: "{{ hostvars['K8S_JOIN_DATA']['control_join_command'] }}"
      when: not kubelet_conf.stat.exists

# -----------------------------------------------------------------------------
# Play 5: Join worker nodes
# -----------------------------------------------------------------------------
- name: Join worker nodes
  hosts: k8work
  become: true
  tasks:
    - name: Check if node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join as worker node
      ansible.builtin.shell: "{{ hostvars['K8S_JOIN_DATA']['worker_join_command'] }}"
      when: not kubelet_conf.stat.exists

# -----------------------------------------------------------------------------
# Play 6: Deploy cluster applications via Helm (runs from ctrl01)
# -----------------------------------------------------------------------------
- name: Deploy cluster applications
  hosts: k8control[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:

    # --- Cilium CNI ---
    - name: Add Cilium Helm repo
      ansible.builtin.shell: helm repo add cilium https://helm.cilium.io/
      changed_when: false

    - name: Deploy Cilium CNI
      ansible.builtin.shell: >
        helm upgrade --install cilium cilium/cilium
        --namespace kube-system
        --set kubeProxyReplacement=true
        --set k8sServiceHost={{ k8s_vip }}
        --set k8sServicePort=6443
        --wait --timeout 5m
      register: cilium_deploy
      changed_when: "'already up-to-date' not in cilium_deploy.stdout"

    - name: Wait for all nodes to be Ready
      ansible.builtin.shell: kubectl wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false

    # --- MetalLB ---
    - name: Add MetalLB Helm repo
      ansible.builtin.shell: helm repo add metallb https://metallb.github.io/metallb
      changed_when: false

    - name: Deploy MetalLB
      ansible.builtin.shell: >
        helm upgrade --install metallb metallb/metallb
        --namespace metallb-system
        --create-namespace
        --wait --timeout 5m
      register: metallb_deploy
      changed_when: "'already up-to-date' not in metallb_deploy.stdout"

    - name: Wait for MetalLB webhook to be ready
      ansible.builtin.shell: >
        kubectl wait --namespace metallb-system
        --for=condition=ready pod
        --selector=app.kubernetes.io/name=metallb
        --timeout=90s
      changed_when: false

    - name: Configure MetalLB IP address pool
      ansible.builtin.shell: |
        kubectl apply -f - <<EOF
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: homelab-pool
          namespace: metallb-system
        spec:
          addresses:
          - {{ metallb_ip_pool }}
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: homelab-l2
          namespace: metallb-system
        spec:
          ipAddressPools:
          - homelab-pool
        EOF
      changed_when: true

    # --- Traefik Ingress ---
    - name: Add Traefik Helm repo
      ansible.builtin.shell: helm repo add traefik https://traefik.github.io/charts
      changed_when: false

    - name: Deploy Traefik ingress controller
      ansible.builtin.shell: >
        helm upgrade --install traefik traefik/traefik
        --namespace traefik
        --create-namespace
        --wait --timeout 5m
      register: traefik_deploy
      changed_when: "'already up-to-date' not in traefik_deploy.stdout"

    # --- Longhorn Storage ---
    - name: Add Longhorn Helm repo
      ansible.builtin.shell: helm repo add longhorn https://charts.longhorn.io
      changed_when: false

    - name: Deploy Longhorn
      ansible.builtin.shell: >
        helm upgrade --install longhorn longhorn/longhorn
        --namespace longhorn-system
        --create-namespace
        --set defaultSettings.defaultDataPath=/var/lib/longhorn
        --wait --timeout 10m
      register: longhorn_deploy
      changed_when: "'already up-to-date' not in longhorn_deploy.stdout"

    - name: Wait for Longhorn Node objects to be created
      ansible.builtin.shell: >
        kubectl -n longhorn-system get node.longhorn.io
        --no-headers | wc -l
      register: longhorn_nodes
      until: longhorn_nodes.stdout | int >= groups['k8work'] | length
      retries: 20
      delay: 15
      changed_when: false

    - name: Add SATA disk to each worker node in Longhorn
      ansible.builtin.shell: |
        kubectl -n longhorn-system patch node.longhorn.io {{ item | lower }} \
          --type=merge \
          --patch '{
            "spec": {
              "disks": {
                "longhorn-sata": {
                  "path": "/var/lib/longhorn-sata",
                  "allowScheduling": true,
                  "storageReserved": 10737418240,
                  "tags": ["sata"]
                }
              }
            }
          }'
      loop: "{{ groups['k8work'] }}"
      register: longhorn_patch
      until: longhorn_patch.rc == 0
      retries: 10
      delay: 15
      changed_when: longhorn_patch.rc == 0
      failed_when: longhorn_patch.rc != 0 and longhorn_patch.attempts >= 10

    - name: Create Longhorn NVMe StorageClass (default)
      ansible.builtin.shell: |
        kubectl apply -f - <<EOF
        kind: StorageClass
        apiVersion: storage.k8s.io/v1
        metadata:
          name: longhorn-nvme
          annotations:
            storageclass.kubernetes.io/is-default-class: "true"
        provisioner: driver.longhorn.io
        allowVolumeExpansion: true
        parameters:
          numberOfReplicas: "2"
          diskSelector: "nvme"
          dataLocality: "disabled"
        EOF
      changed_when: true

    - name: Create Longhorn SATA StorageClass
      ansible.builtin.shell: |
        kubectl apply -f - <<EOF
        kind: StorageClass
        apiVersion: storage.k8s.io/v1
        metadata:
          name: longhorn-sata
        provisioner: driver.longhorn.io
        allowVolumeExpansion: true
        parameters:
          numberOfReplicas: "2"
          diskSelector: "sata"
          dataLocality: "disabled"
        EOF
      changed_when: true

    # --- ArgoCD ---
    - name: Add ArgoCD Helm repo
      ansible.builtin.shell: helm repo add argo https://argoproj.github.io/argo-helm
      changed_when: false

    - name: Deploy ArgoCD
      ansible.builtin.shell: >
        helm upgrade --install argocd argo/argo-cd
        --namespace argocd
        --create-namespace
        --wait --timeout 10m
      register: argocd_deploy
      changed_when: "'already up-to-date' not in argocd_deploy.stdout"

    - name: Get ArgoCD initial admin password
      ansible.builtin.shell: >
        kubectl -n argocd get secret argocd-initial-admin-secret
        -o jsonpath='{.data.password}' | base64 -d
      register: argocd_password
      changed_when: false

    - name: Display ArgoCD admin password
      ansible.builtin.debug:
        msg: "ArgoCD admin password: {{ argocd_password.stdout }}"
